      폰트 교체 시점에 줄어들면서 레이아웃이 밀린다(375px 폭에서 CLS 0.126 관측).
      실제 쓰는 굵기는 700(B)과 900(EB) 둘뿐이다.
      폰트 요청은 CORS 모드라 같은 오리진이라도 crossorigin 이 필요하다.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/keris/KERISBAEUM_B.woff2"
      crossorigin
    />
    <link
      rel="preload"

      crossorigin
